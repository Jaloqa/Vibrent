openapi: 3.1.1
info:
  title: Vibrent API
  version: 1.0.0
  description: >
    Contract shared by the backend and the frontend. Change it first, agree it with the
    other side, then implement. Errors use RFC 9457 ProblemDetails; business errors carry
    a machine-readable `code` (for example `Auth.EmailTaken`).

servers:
  - url: http://localhost:8080

security:
  - bearer: []

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Events
  - name: Feed
  - name: Swipes
  - name: Applications
  - name: Admin
    description: >
      Requires the Admin role. Grant it with
      `UPDATE "Users" SET "Role" = 'Admin' WHERE "Email" = '<email>';`
      and sign in again to get a token with the new role.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; the response contains an access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: '`Auth.EmailTaken`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: '`Auth.InvalidCredentials`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`Auth.UserBlocked`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/change-password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid data or `Auth.InvalidCurrentPassword`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get the signed-in user's profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List event categories
      description: Bounded reference data, returned without pagination.
      responses:
        '200':
          description: Categories ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events:
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event organized by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Event created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid data or `Category.NotFound`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/mine:
    get:
      tags: [Events]
      operationId: listMyEvents
      summary: List events organized by the signed-in user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events ordered from the latest start date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEventPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/feed:
    get:
      tags: [Feed]
      operationId: getFeed
      summary: Get event cards to swipe
      description: >
        Upcoming active events with free seats, ordered by start date. Skips events the user
        already swiped and the user's own events. Location filter needs `lat`, `lng` and
        `radiusKm` together.
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 200
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: '`nextCursor` from the previous page'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{eventId}/swipe:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Swipes]
      operationId: swipeEvent
      summary: Like or dislike an event card
      description: A like creates a pending application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '200':
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swipe'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`Event.OwnEvent`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: '`Swipe.AlreadySwiped`, `Event.NoFreeSeats`, `Event.Cancelled` or `Event.Finished`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /events/{eventId}/applications:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Applications]
      operationId: listEventApplications
      summary: List applications to an event (organizer only)
      parameters:
        - $ref: '#/components/parameters/ApplicationStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Applications from the oldest, with applicant profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApplicationPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOrganizer'
        '404':
          $ref: '#/components/responses/EventNotFound'

  /applications/mine:
    get:
      tags: [Applications]
      operationId: listMyApplications
      summary: List the signed-in user's applications
      parameters:
        - $ref: '#/components/parameters/ApplicationStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Applications from the newest, with event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyApplicationPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      tags: [Applications]
      operationId: decideApplication
      summary: Accept or reject a pending application (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
      responses:
        '200':
          description: Decision saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDecision'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOrganizer'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '409':
          description: >
            `Application.NotPending`, `Event.NoFreeSeats`, `Event.Cancelled`, or a concurrent
            change (for example another accept took the last seat first)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /applications/{applicationId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      tags: [Applications]
      operationId: withdrawApplication
      summary: Withdraw the signed-in user's pending or accepted application
      description: Withdrawing an accepted application frees a seat.
      responses:
        '204':
          description: Application withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`Application.NotApplicant`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '409':
          description: '`Application.CannotWithdraw` or a concurrent change'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List and search user accounts
      parameters:
        - name: search
          in: query
          description: Part of the email or display name, case-insensitive
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Users from the newest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/block:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: blockUser
      summary: Block an account; its tokens stop working immediately
      responses:
        '204':
          description: User blocked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: '`User.CannotBlockAdmin`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/users/{userId}/unblock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: unblockUser
      summary: Unblock an account
      responses:
        '204':
          description: User unblocked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /admin/events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Admin]
      operationId: moderateCancelEvent
      summary: Cancel any event as a moderation action
      responses:
        '204':
          description: Event cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: '`Event.Cancelled`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get event details
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EventNotFound'
    put:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid data or `Category.NotFound`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOrganizer'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: '`Event.Cancelled`, `Event.Finished`, `Event.CapacityBelowAccepted` or a concurrent change'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event without applications (organizer only)
      description: Events that already have applications cannot be deleted; cancel them instead.
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOrganizer'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: '`Event.HasApplications`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel an event (organizer only)
      responses:
        '204':
          description: Event cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOrganizer'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: '`Event.Cancelled`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationProblem:
      description: Request data is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Missing or invalid access token
    Forbidden:
      description: The account is blocked or lacks the required role
    UserNotFound:
      description: '`User.NotFound`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotOrganizer:
      description: '`Event.NotOrganizer`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EventNotFound:
      description: '`Event.NotFound`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ApplicationNotFound:
      description: '`Application.NotFound`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ApplicationStatus'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          maxLength: 50

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must differ from the current password

    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 50
        bio:
          type: [string, 'null']
          maxLength: 500
        city:
          type: [string, 'null']
          maxLength: 100

    AuthResponse:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
          description: JWT to send as `Authorization: Bearer <token>`
        expiresAt:
          type: string
          format: date-time

    Profile:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        bio:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
        city:
          type: [string, 'null']
        role:
          type: string
          enum: [User, Admin]

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    EventRequest:
      type: object
      required: [categoryId, title, description, startsAt, address, latitude, longitude, capacity]
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        startsAt:
          type: string
          format: date-time
          description: Must be in the future
        address:
          type: string
          maxLength: 200
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
          description: On update it cannot be lower than the number of accepted participants

    EventState:
      type: string
      enum: [Active, Finished, Cancelled]
      description: Finished is computed from `startsAt`

    Event:
      type: object
      required: [id, organizerId, organizerName, categoryId, categoryName, title, description, startsAt, address, latitude, longitude, capacity, acceptedCount, freeSeats, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        organizerName:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        capacity:
          type: integer
        acceptedCount:
          type: integer
        freeSeats:
          type: integer
        imageUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/EventState'
        createdAt:
          type: string
          format: date-time

    MyEvent:
      type: object
      required: [id, title, categoryName, startsAt, address, capacity, acceptedCount, freeSeats, pendingApplications, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        categoryName:
          type: string
        startsAt:
          type: string
          format: date-time
        address:
          type: string
        capacity:
          type: integer
        acceptedCount:
          type: integer
        freeSeats:
          type: integer
        pendingApplications:
          type: integer
        status:
          $ref: '#/components/schemas/EventState'

    MyEventPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyEvent'
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer

    FeedCard:
      type: object
      required: [id, title, description, categoryName, organizerName, startsAt, address, latitude, longitude, capacity, freeSeats]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        categoryName:
          type: string
        organizerName:
          type: string
        startsAt:
          type: string
          format: date-time
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        capacity:
          type: integer
        freeSeats:
          type: integer
        imageUrl:
          type: [string, 'null']
        distanceKm:
          type: [number, 'null']
          description: Present when the location filter is used

    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedCard'
        nextCursor:
          type: [string, 'null']
          description: Null on the last page

    SwipeDecision:
      type: string
      enum: [Like, Dislike]

    SwipeRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/SwipeDecision'

    Swipe:
      type: object
      required: [eventId, decision]
      properties:
        eventId:
          type: string
          format: uuid
        decision:
          $ref: '#/components/schemas/SwipeDecision'
        applicationId:
          type: [string, 'null']
          format: uuid
          description: Id of the pending application created by a like

    ApplicationStatus:
      type: string
      enum: [Pending, Accepted, Rejected, Withdrawn]

    Applicant:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
        city:
          type: [string, 'null']

    EventApplication:
      type: object
      required: [id, status, createdAt, applicant]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        applicant:
